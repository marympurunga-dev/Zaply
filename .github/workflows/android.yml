name: Build Android app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create the Android project
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -e
          if [ -z "$GSJ" ]; then echo "::error::The secret GOOGLE_SERVICES_JSON is missing. Add it in Settings > Secrets and variables > Actions."; exit 1; fi
          SITE_URL="${SITE_URL:-https://zaply-gamma.vercel.app}"
          rm -rf android-app
          mkdir -p android-app
          cd android-app
          mkdir -p app
          cat > app/build.gradle <<'ZEOF'
          plugins {
              id 'com.android.application'
              id 'com.google.gms.google-services'
          }

          android {
              namespace 'com.zanply.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.zanply.app'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              signingConfigs {
                  zanply {
                      storeFile file('zanply.keystore')
                      storePassword 'zanply123'
                      keyAlias 'zanply'
                      keyPassword 'zanply123'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.zanply
                  }
              }

              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'com.google.firebase:firebase-messaging:24.0.1'
          }
          ZEOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'ZEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.WRITE_CONTACTS" />

              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|density|uiMode|keyboard|navigation">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".CallActivity"
                      android:exported="false"
                      android:launchMode="singleInstance"
                      android:excludeFromRecents="true"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true"
                      android:taskAffinity="" />

                  <service
                      android:name=".FcmService"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="com.google.firebase.MESSAGING_EVENT" />
                      </intent-filter>
                  </service>

                  <receiver
                      android:name=".CallReceiver"
                      android:exported="false" />
              </application>
          </manifest>
          ZEOF
          mkdir -p app/src/main/java/com/zanply/app
          cat > app/src/main/java/com/zanply/app/CallActivity.java <<'ZEOF'
          package com.zanply.app;

          import android.app.Activity;
          import android.app.KeyguardManager;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import java.lang.ref.WeakReference;

          /** Full-screen incoming call screen, shown over the lock screen. The ringing itself comes from the notification. */
          public class CallActivity extends Activity {
              private static WeakReference<CallActivity> current;
              private final Handler h = new Handler(Looper.getMainLooper());
              private String from, name, call;

              static void finishIfOpen() {
                  CallActivity a = current == null ? null : current.get();
                  if (a != null) a.finish();
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  current = new WeakReference<>(this);
                  setShowWhenLocked(true);
                  setTurnScreenOn(true);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  from = getIntent().getStringExtra("from");
                  name = getIntent().getStringExtra("name");
                  call = getIntent().getStringExtra("call");
                  boolean video = getIntent().getBooleanExtra("video", false);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.setBackgroundColor(Color.parseColor("#0b141a"));
                  root.setPadding(dp(24), dp(96), dp(24), dp(72));

                  TextView app = text("Zanply " + (video ? "video call" : "voice call"), 15, Color.parseColor("#8696a0"), false);
                  TextView who = text(name == null ? "" : name, 34, Color.WHITE, true);
                  who.setPadding(0, dp(18), 0, dp(6));
                  TextView sub = text("Incoming call…", 16, Color.parseColor("#8696a0"), false);
                  root.addView(app);
                  root.addView(who);
                  root.addView(sub);

                  View space = new View(this);
                  root.addView(space, new LinearLayout.LayoutParams(1, 0, 1f));

                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER);
                  row.addView(button("Decline", "#e5173f", new View.OnClickListener() {
                      @Override public void onClick(View v) { decline(); }
                  }));
                  View gap = new View(this);
                  row.addView(gap, new LinearLayout.LayoutParams(dp(56), 1));
                  row.addView(button("Answer", "#1fa855", new View.OnClickListener() {
                      @Override public void onClick(View v) { answer(); }
                  }));
                  root.addView(row);
                  setContentView(root);

                  h.postDelayed(new Runnable() { @Override public void run() { finish(); } }, 40000);
              }

              private void answer() {
                  Notifs.cancelCall(this);
                  KeyguardManager km = getSystemService(KeyguardManager.class);
                  Intent i = new Intent(this, MainActivity.class)
                          .setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP)
                          .putExtra("answer_from", from).putExtra("answer_name", name).putExtra("answer_body", call);
                  startActivity(i);
                  if (km != null && km.isKeyguardLocked()) km.requestDismissKeyguard(this, null);
                  finish();
              }

              private void decline() {
                  Store.markHandled(this, call);
                  Notifs.cancelCall(this);
                  finish();
              }

              @Override
              protected void onDestroy() {
                  h.removeCallbacksAndMessages(null);
                  if (current != null && current.get() == this) current = null;
                  super.onDestroy();
              }

              @Override
              public void onBackPressed() { decline(); }

              private int dp(int v) { return (int) (v * getResources().getDisplayMetrics().density + 0.5f); }

              private TextView text(String s, int sp, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(sp);
                  t.setTextColor(color);
                  t.setGravity(Gravity.CENTER);
                  if (bold) t.setTypeface(Typeface.DEFAULT_BOLD);
                  return t;
              }

              private TextView button(String label, String color, View.OnClickListener l) {
                  TextView t = text(label, 16, Color.WHITE, true);
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(Color.parseColor(color));
                  g.setCornerRadius(dp(40));
                  t.setBackground(g);
                  t.setPadding(dp(34), dp(18), dp(34), dp(18));
                  t.setOnClickListener(l);
                  return t;
              }
          }
          ZEOF
          mkdir -p app/src/main/java/com/zanply/app
          cat > app/src/main/java/com/zanply/app/CallReceiver.java <<'ZEOF'
          package com.zanply.app;

          import android.app.NotificationManager;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.app.RemoteInput;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.widget.Toast;

          public class CallReceiver extends BroadcastReceiver {
              static final String ACTION_DECLINE = "com.zanply.app.DECLINE";
              static final String ACTION_READ = "com.zanply.app.READ";
              static final String ACTION_MUTE = "com.zanply.app.MUTE";
              static final String ACTION_REMIND = "com.zanply.app.REMIND";
              static final String ACTION_REPLY = "com.zanply.app.REPLY";
              static final String KEY_REPLY = "reply_text";

              @Override
              public void onReceive(final Context c, Intent i) {
                  String a = i.getAction();
                  if (ACTION_DECLINE.equals(a)) {
                      Store.markHandled(c, i.getStringExtra("call"));
                      Notifs.cancelCall(c);
                      CallActivity.finishIfOpen();
                  } else if (ACTION_READ.equals(a)) {
                      final String from = i.getStringExtra("from");
                      NotificationManager nm = c.getSystemService(NotificationManager.class);
                      if (nm != null) nm.cancel(i.getIntExtra("nid", 0));
                      Store.histDrop(c, from);
                      Store.readAdd(c, from);
                      final PendingResult pr = goAsync();
                      new Thread(new Runnable() {
                          @Override public void run() {
                              try { Notifs.markReadOnServer(c, from); } finally { pr.finish(); }
                          }
                      }).start();
                  } else if (ACTION_MUTE.equals(a)) {
                      String from = i.getStringExtra("from");
                      NotificationManager nm = c.getSystemService(NotificationManager.class);
                      if (nm != null) nm.cancel(i.getIntExtra("nid", 0));
                      Store.histDrop(c, from);
                      Store.muteSet(c, from, System.currentTimeMillis() + 8L * 60L * 60L * 1000L);
                      Store.log(c, "Muted " + i.getStringExtra("who") + " for 8 hours (from the notification button).");
                  } else if (ACTION_REPLY.equals(a)) {
                      final String from = i.getStringExtra("from");
                      final String who = i.getStringExtra("who");
                      final int nid = i.getIntExtra("nid", 0);
                      Bundle res = RemoteInput.getResultsFromIntent(i);
                      CharSequence cs = res == null ? null : res.getCharSequence(KEY_REPLY);
                      final String text = cs == null ? "" : cs.toString().trim();
                      final NotificationManager nm = c.getSystemService(NotificationManager.class);
                      if (text.length() == 0 || from == null) { if (nm != null) nm.cancel(nid); return; }
                      final PendingResult pr = goAsync();
                      new Thread(new Runnable() {
                          @Override public void run() {
                              boolean ok = false;
                              try { ok = Notifs.sendReplyOnServer(c, from, text); } finally {
                                  if (nm != null) nm.cancel(nid); // also stops the spinner on the reply box
                                  if (ok) {
                                      Store.histDrop(c, from);
                                      Store.readAdd(c, from);
                                      Notifs.markReadOnServer(c, from);
                                  } else {
                                      Notifs.replyFailed(c, from, who);
                                      new Handler(Looper.getMainLooper()).post(new Runnable() {
                                          @Override public void run() { Toast.makeText(c, "Reply not sent", Toast.LENGTH_LONG).show(); }
                                      });
                                  }
                                  pr.finish();
                              }
                          }
                      }).start();
                  } else if (ACTION_REMIND.equals(a)) {
                      Notifs.remind(c);
                  }
              }
          }
          ZEOF
          mkdir -p app/src/main/java/com/zanply/app
          cat > app/src/main/java/com/zanply/app/FcmService.java <<'ZEOF'
          package com.zanply.app;

          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;

          import java.util.Map;

          public class FcmService extends FirebaseMessagingService {

              @Override
              public void onNewToken(String token) {
                  Store.saveToken(this, token);
                  MainActivity.sendTokenToPage(token);
              }

              @Override
              public void onMessageReceived(RemoteMessage m) {
                  Map<String, String> d = m.getData();
                  if (d == null || d.isEmpty()) return;
                  String type = d.get("type");
                  Store.putLong(this, "lastPush", System.currentTimeMillis());
                  Store.putStr(this, "lastType", type == null ? "" : type);
                  Store.log(this, "Push received from the server (" + (type == null || type.length() == 0 ? "message" : type) + ").");
                  // While the app is open the web page already plays its own sound and shows the call screen.
                  if (MainActivity.visible) { Store.log(this, "Not shown: Zanply is open on the screen, so the app handles it."); return; }

                  if ("call".equals(type)) {
                      String body = d.get("call");
                      if (body == null || body.length() == 0) return;
                      String saved = Notifs.contactName(this, nz(d.get("sender")));
                      Notifs.showCall(this, nz(d.get("sender")), saved != null ? saved : (nz(d.get("name")).length() > 0 ? d.get("name") : nz(d.get("sender"))),
                              body, "1".equals(d.get("video")));
                  } else if ("cancel".equals(type)) {
                      Notifs.cancelCall(this);
                  } else {
                      String from = nz(d.get("sender"));
                      String text = nz(d.get("body"));
                      if (nz(d.get("cipher")).length() > 0 && !from.startsWith("g:")) {
                          String pt = Crypt.decrypt(this, from, nz(d.get("me")), d.get("cipher"));
                          if (pt != null) text = Crypt.preview(pt);
                          else Store.log(this, "Could not open the message text on this phone (no key yet), showing New message.");
                      }
                      String savedName = Notifs.contactName(this, from);
                      Notifs.showMessage(this, from, savedName != null ? savedName : (nz(d.get("title")).length() > 0 ? d.get("title") : "Zanply"), text,
                              nz(d.get("photo")), from.startsWith("g:"), "react".equals(type));
                  }
              }

              private static String nz(String s) { return s == null ? "" : s; }
          }
          ZEOF
          mkdir -p app/src/main/java/com/zanply/app
          cat > app/src/main/java/com/zanply/app/MainActivity.java <<'ZEOF'
          package com.zanply.app;

          import android.Manifest;
          import android.app.Activity;
          import android.app.KeyguardManager;
          import android.app.NotificationManager;
          import android.content.ContentProviderOperation;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.media.AudioAttributes;
          import android.media.AudioManager;
          import android.media.Ringtone;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.os.Bundle;
          import android.os.Message;
          import android.provider.ContactsContract;
          import android.provider.MediaStore;
          import android.provider.Settings;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import com.google.firebase.messaging.FirebaseMessaging;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          import java.lang.ref.WeakReference;
          import java.util.ArrayList;
          import java.util.HashSet;
          import java.util.List;

          /** The Zanply web app inside a WebView, plus the bridge that gives it the phone's own sounds. */
          public class MainActivity extends Activity {
              static volatile boolean visible = false;
              private static WeakReference<MainActivity> self;

              private static final int REQ_FILE = 1, REQ_PERM = 2, REQ_NOTIF = 3, REQ_TONE = 4, REQ_CONTACTS = 5;

              private WebView web;
              private ValueCallback<Uri[]> filePath;
              private PermissionRequest pendingPerm;
              private String siteHost = "";

              // handed to the page when it asks (takeAnswer / takeOpenChat)
              private volatile String answerJson = "";
              private volatile String openChat = "";

              private Ringtone ring;
              private String toneKind = "m"; // which tone the picker is open for: m = messages, g = groups, c = calls

              /* ---------------- life cycle ---------------- */

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  self = new WeakReference<>(this);
                  Notifs.ensureChannels(this);

                  String site = getString(R.string.site_url);
                  try { siteHost = Uri.parse(site).getHost(); } catch (Exception ignored) { }

                  web = new WebView(this);
                  web.setBackgroundColor(0xFF000000);
                  setContentView(web, new ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  setupWebView();
                  web.addJavascriptInterface(new Bridge(), "ZanplyNative");

                  handleIntent(getIntent());
                  web.loadUrl(site);

                  askPermissionsOnce();
                  FirebaseMessaging.getInstance().getToken().addOnSuccessListener(this::onToken);
              }

              private void onToken(String t) {
                  if (t == null || t.length() == 0) return;
                  Store.saveToken(this, t);
                  sendTokenToPage(t);
              }

              @Override
              protected void onNewIntent(Intent i) {
                  super.onNewIntent(i);
                  setIntent(i);
                  handleIntent(i);
                  pokePage();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  visible = true;
                  stopRing();
                  Notifs.cancelAll(this);
                  pokePage();
              }

              @Override
              protected void onPause() {
                  visible = false;
                  super.onPause();
              }

              @Override
              protected void onDestroy() {
                  stopRing();
                  if (web != null) { web.destroy(); web = null; }
                  super.onDestroy();
              }

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) web.goBack();
                  else moveTaskToBack(true);
              }

              private void handleIntent(Intent i) {
                  if (i == null) return;
                  String body = i.getStringExtra("answer_body");
                  if (body != null && body.length() > 0) {
                      try {
                          JSONObject o = new JSONObject();
                          o.put("body", body);
                          o.put("phone", i.getStringExtra("answer_from"));
                          o.put("name", i.getStringExtra("answer_name"));
                          answerJson = o.toString();
                          Store.markHandled(this, body);
                      } catch (Exception ignored) { }
                      Notifs.cancelCall(this);
                      setShowWhenLocked(true);
                      setTurnScreenOn(true);
                      i.removeExtra("answer_body");
                  }
                  String chat = i.getStringExtra("chat");
                  if (chat != null && chat.length() > 0) {
                      openChat = chat;
                      i.removeExtra("chat");
                  }
              }

              private void pokeTone() {
                  if (web == null) return;
                  web.evaluateJavascript("window.onToneChosen&&window.onToneChosen()", null);
              }

              private String toneName() { return toneName("m"); }

              private String toneName(String kind) {
                  try {
                      String key = "g".equals(kind) ? "toneUriG" : "c".equals(kind) ? "ringUri" : "toneUri";
                      String u = Store.getStr(this, key, "");
                      if (u.length() == 0) return "Default";
                      if (u.equals("silent")) return "Silent";
                      Ringtone r = RingtoneManager.getRingtone(this, Uri.parse(u));
                      return r == null ? "Custom" : r.getTitle(this);
                  } catch (Exception e) { return "Custom"; }
              }

              private void pokePage() {
                  if (web == null) return;
                  web.evaluateJavascript("window.zNativeCheck&&window.zNativeCheck()", null);
              }

              static void sendTokenToPage(final String t) {
                  final MainActivity a = self == null ? null : self.get();
                  if (a == null || a.web == null) return;
                  a.runOnUiThread(new Runnable() {
                      @Override public void run() {
                          if (a.web != null) a.web.evaluateJavascript("window.onFcmToken&&window.onFcmToken(" + JSONObject.quote(t) + ")", null);
                      }
                  });
              }

              /* ---------------- permissions ---------------- */

              private void askPermissionsOnce() {
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, REQ_NOTIF);
                  } else {
                      askFullScreen();
                  }
              }

              // Android 14+ lets the user switch "full screen notifications" off; the call screen over the lock screen needs it.
              private void askFullScreen() {
                  if (Build.VERSION.SDK_INT >= 34 && !Store.flag(this, "askedFsi")) {
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null && !nm.canUseFullScreenIntent()) {
                          Store.setFlag(this, "askedFsi");
                          try {
                              startActivity(new Intent(Settings.ACTION_MANAGE_APP_USE_FULL_SCREEN_INTENT, Uri.parse("package:" + getPackageName())));
                          } catch (Exception ignored) { }
                      }
                  }
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] res) {
                  super.onRequestPermissionsResult(code, perms, res);
                  if (code == REQ_NOTIF) { askFullScreen(); return; }
                  if (code == REQ_CONTACTS) {
                      final boolean ok = granted(Manifest.permission.READ_CONTACTS);
                      if (web != null) web.evaluateJavascript("window.onContactsPerm&&window.onContactsPerm(" + ok + ")", null);
                      return;
                  }
                  if (code == REQ_PERM && pendingPerm != null) {
                      PermissionRequest r = pendingPerm;
                      pendingPerm = null;
                      List<String> ok = new ArrayList<>();
                      for (String res1 : r.getResources()) {
                          if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(res1) && granted(Manifest.permission.CAMERA)) ok.add(res1);
                          else if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(res1) && granted(Manifest.permission.RECORD_AUDIO)) ok.add(res1);
                      }
                      if (ok.isEmpty()) r.deny(); else r.grant(ok.toArray(new String[0]));
                  }
              }

              private boolean granted(String p) { return checkSelfPermission(p) == PackageManager.PERMISSION_GRANTED; }

              /* ---------------- WebView ---------------- */

              private void setupWebView() {
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  s.setSupportMultipleWindows(true);
                  s.setJavaScriptCanOpenWindowsAutomatically(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  s.setUserAgentString(s.getUserAgentString() + " ZanplyApp/1");

                  web.setDownloadListener((url, ua, cd, mime, len) -> openExternal(Uri.parse(url)));

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          String sch = u.getScheme() == null ? "" : u.getScheme();
                          if (("https".equals(sch) || "http".equals(sch)) && u.getHost() != null && u.getHost().equals(siteHost)) return false;
                          openExternal(u);
                          return true;
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (filePath != null) filePath.onReceiveValue(null);
                          filePath = cb;
                          try {
                              startActivityForResult(p.createIntent(), REQ_FILE);
                          } catch (Exception e) {
                              filePath = null;
                              return false;
                          }
                          return true;
                      }

                      @Override
                      public void onPermissionRequest(final PermissionRequest r) {
                          runOnUiThread(new Runnable() {
                              @Override public void run() {
                                  List<String> need = new ArrayList<>();
                                  for (String res : r.getResources()) {
                                      if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(res) && !granted(Manifest.permission.CAMERA)) need.add(Manifest.permission.CAMERA);
                                      if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(res) && !granted(Manifest.permission.RECORD_AUDIO)) need.add(Manifest.permission.RECORD_AUDIO);
                                  }
                                  if (need.isEmpty()) { r.grant(r.getResources()); return; }
                                  if (pendingPerm != null) pendingPerm.deny();
                                  pendingPerm = r;
                                  requestPermissions(need.toArray(new String[0]), REQ_PERM);
                              }
                          });
                      }

                      @Override
                      public boolean onCreateWindow(WebView v, boolean dialog, boolean userGesture, Message msg) {
                          WebView t = new WebView(MainActivity.this);
                          t.setWebViewClient(new WebViewClient() {
                              @Override
                              public boolean shouldOverrideUrlLoading(WebView v2, WebResourceRequest r) {
                                  openExternal(r.getUrl());
                                  return true;
                              }
                          });
                          ((WebView.WebViewTransport) msg.obj).setWebView(t);
                          msg.sendToTarget();
                          return true;
                      }
                  });
              }

