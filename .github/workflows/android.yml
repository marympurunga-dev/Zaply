          package com.zanply.app;

          import android.content.Context;
          import android.content.SharedPreferences;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.util.ArrayList;
          import java.util.List;

          /** Small helper around SharedPreferences. */
          final class Store {
              private static SharedPreferences p(Context c) {
                  return c.getApplicationContext().getSharedPreferences("zanply", Context.MODE_PRIVATE);
              }

              static String token(Context c) { return p(c).getString("fcm", ""); }

              static void saveToken(Context c, String t) { p(c).edit().putString("fcm", t == null ? "" : t).apply(); }

              /** Calls that were already answered, declined or timed out here (so the web app does not ring for them again). */
              static synchronized void markHandled(Context c, String body) {
                  if (body == null || body.length() == 0) return;
                  List<String> l = handledList(c);
                  if (!l.contains(body)) l.add(body);
                  while (l.size() > 20) l.remove(0);
                  p(c).edit().putString("handled", new JSONArray(l).toString()).apply();
              }

              static synchronized String handledJson(Context c) { return new JSONArray(handledList(c)).toString(); }

              private static List<String> handledList(Context c) {
                  List<String> l = new ArrayList<>();
                  try {
                      JSONArray a = new JSONArray(p(c).getString("handled", "[]"));
                      for (int i = 0; i < a.length(); i++) l.add(a.getString(i));
                  } catch (Exception ignored) { }
                  return l;
              }

              static String getStr(Context c, String k, String d) { return p(c).getString(k, d); }

              static void putStr(Context c, String k, String v) { p(c).edit().putString(k, v).apply(); }

              static long getLong(Context c, String k) { return p(c).getLong(k, 0L); }

              static void putLong(Context c, String k, long v) { p(c).edit().putLong(k, v).apply(); }

              static boolean flag(Context c, String k) { return p(c).getBoolean(k, false); }

              static void setFlag(Context c, String k) { p(c).edit().putBoolean(k, true).apply(); }

              /* ---------- activity log (shown in "Check notifications") ---------- */

              static synchronized void log(Context c, String msg) {
                  try {
                      JSONArray a = new JSONArray(p(c).getString("nlog", "[]"));
                      JSONObject o = new JSONObject();
                      o.put("t", System.currentTimeMillis());
                      o.put("m", msg);
                      a.put(o);
                      JSONArray b = new JSONArray();
                      for (int i = Math.max(0, a.length() - 60); i < a.length(); i++) b.put(a.get(i));
                      p(c).edit().putString("nlog", b.toString()).apply();
                  } catch (Exception ignored) { }
              }

              static synchronized String logs(Context c) { return p(c).getString("nlog", "[]"); }

              static synchronized void clearLogs(Context c) { p(c).edit().putString("nlog", "[]").apply(); }

              /* ---------- the last few unread messages of each chat (so a notification can list them) ---------- */

              static synchronized JSONArray histAdd(Context c, String from, String text, long t) {
                  try {
                      JSONObject all = new JSONObject(p(c).getString("hist", "{}"));
                      JSONArray a = all.optJSONArray(from);
                      if (a == null) a = new JSONArray();
                      JSONObject o = new JSONObject();
                      o.put("x", text);
                      o.put("t", t);
                      a.put(o);
                      JSONArray b = new JSONArray();
                      for (int i = Math.max(0, a.length() - 6); i < a.length(); i++) b.put(a.get(i));
                      all.put(from, b);
                      p(c).edit().putString("hist", all.toString()).apply();
                      return b;
                  } catch (Exception e) {
                      return new JSONArray();
                  }
              }

              static synchronized void histDrop(Context c, String from) {
                  try {
                      JSONObject all = new JSONObject(p(c).getString("hist", "{}"));
                      all.remove(from);
                      p(c).edit().putString("hist", all.toString()).apply();
                  } catch (Exception ignored) { }
              }

          /* muted chats: {"+234...": untilMillis}. Shared by the notification's Mute button and the page's Mute menu. */
          static synchronized void muteSet(Context c, String from, long until) {
              if (from == null || from.length() == 0) return;
              try {
                  JSONObject o = new JSONObject(p(c).getString("mutes", "{}"));
                  if (until > System.currentTimeMillis()) o.put(from, until); else o.remove(from);
                  p(c).edit().putString("mutes", o.toString()).apply();
              } catch (Exception ignored) { }
          }

          static synchronized long muteGet(Context c, String from) {
              try { return new JSONObject(p(c).getString("mutes", "{}")).optLong(from, 0L); } catch (Exception e) { return 0L; }
          }

          /** Only the mutes that have not run out yet. */
          static synchronized String muteJson(Context c) {
              try {
                  JSONObject o = new JSONObject(p(c).getString("mutes", "{}")), out = new JSONObject();
                  long now = System.currentTimeMillis();
                  java.util.Iterator<String> it = o.keys();
                  while (it.hasNext()) { String k = it.next(); long u = o.optLong(k, 0L); if (u > now) out.put(k, u); }
                  return out.toString();
              } catch (Exception e) { return "{}"; }
          }

              /* chats whose notification was marked as read / replied to: the page picks them up and clears its own unread badge */
          static synchronized void readAdd(Context c, String from) {
              if (from == null || from.length() == 0) return;
              try {
                  JSONArray a = new JSONArray(p(c).getString("readq", "[]"));
                  for (int i = 0; i < a.length(); i++) if (from.equals(a.getString(i))) return;
                  a.put(from);
                  p(c).edit().putString("readq", a.toString()).apply();
              } catch (Exception ignored) { }
          }

          static synchronized String readTake(Context c) {
              String v = p(c).getString("readq", "[]");
              p(c).edit().putString("readq", "[]").apply();
              return v;
          }

          static synchronized void histClear(Context c) { p(c).edit().putString("hist", "{}").apply(); }
          }
