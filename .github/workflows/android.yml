          /**
           * Builds the message and incoming-call notifications.
           * Everything follows the settings the person chose in Zanply: tone (from the phone's own sounds), vibrate, light,
           * popup, high priority, conversation tones and reaction notifications - separately for messages, groups and calls.
           */
          final class Notifs {
              static final int CALL_ID = 4242, REMIND_ID = 4343;

              /* ---------------- the person's settings ---------------- */

              static JSONObject prefs(Context c) {
                  try { return new JSONObject(Store.getStr(c, "prefs", "{}")); } catch (Exception e) { return new JSONObject(); }
              }

              static boolean screenOn(Context c) {
                  try { PowerManager pm = c.getSystemService(PowerManager.class); return pm == null || pm.isInteractive(); } catch (Exception e) { return true; }
              }

              static long[] vibPattern(String v, boolean call) {
                  if ("off".equals(v)) return null;
                  if (call) {
                      if ("short".equals(v)) return new long[]{0, 300, 400, 300, 400, 300};
                      if ("long".equals(v)) return new long[]{0, 1200, 600, 1200, 600, 1200};
                      return new long[]{0, 700, 500, 700, 500, 700, 500, 700};
                  }
                  if ("short".equals(v)) return new long[]{0, 120};
                  if ("long".equals(v)) return new long[]{0, 550, 150, 550};
                  return new long[]{0, 200, 100, 200};
              }

              static int lightColor(String l) {
                  if ("green".equals(l)) return 0xFF00C853;
                  if ("blue".equals(l)) return 0xFF2979FF;
                  if ("red".equals(l)) return 0xFFFF1744;
                  if ("yellow".equals(l)) return 0xFFFFEA00;
                  if ("none".equals(l)) return 0;
                  return 0xFFFFFFFF;
              }

              /** kind: "m" messages, "g" groups, "c" calls. null = silent */
              static Uri toneUri(Context c, String kind) {
                  String key = "g".equals(kind) ? "toneUriG" : "c".equals(kind) ? "ringUri" : "toneUri";
                  String u = Store.getStr(c, key, "");
                  if (u.length() == 0) return "c".equals(kind) ? Settings.System.DEFAULT_RINGTONE_URI : Settings.System.DEFAULT_NOTIFICATION_URI;
                  if (u.equals("silent")) return null;
                  return Uri.parse(u);
              }

              static Uri toneUri(Context c) { return toneUri(c, "m"); }

              /** What the person asked for, as an Android notification channel. */
              static final class Want {
                  String id, name, kind;
                  int imp, light;
                  Uri sound;
                  long[] vib;
              }

              static Want want(Context c, String kind, boolean screen) {
                  JSONObject p = prefs(c);
                  Want w = new Want();
                  w.kind = kind;
                  if ("c".equals(kind)) {
                      w.imp = NotificationManager.IMPORTANCE_HIGH;
                      w.sound = toneUri(c, "c");
                      w.vib = vibPattern(p.optString("c_vib", "default"), true);
                      w.light = 0;
                      w.name = "Incoming calls";
                  } else {
                      String k = "g".equals(kind) ? "g" : "m";
                      w.sound = p.optBoolean("tones", true) ? toneUri(c, k) : null;
                      w.vib = vibPattern(p.optString(k + "_vib", "default"), false);
                      w.light = lightColor(p.optString(k + "_light", "white"));
                      boolean high = p.optBoolean(k + "_high", true);
                      String pop = p.optString(k + "_pop", "always");
                      boolean heads = high && !"off".equals(pop) && !("screenon".equals(pop) && !screen);
                      w.imp = heads ? NotificationManager.IMPORTANCE_HIGH : NotificationManager.IMPORTANCE_DEFAULT;
                      w.name = ("g".equals(k) ? "Group messages" : "Messages") + (heads ? "" : " (no popup)");
                  }
                  w.id = "z" + kind + "_" + Integer.toHexString((String.valueOf(w.sound) + "|" + Arrays.toString(w.vib) + "|" + w.light + "|" + w.imp).hashCode());
                  return w;
              }

              /** Creates the channel if it does not exist yet. A channel's sound, vibration and importance cannot change once it exists,
               *  so every different combination of settings gets its own channel id. */
              static String channel(Context c, Want w) {
                  NotificationManager nm = c.getSystemService(NotificationManager.class);
                  if (nm == null || nm.getNotificationChannel(w.id) != null) return w.id;
                  NotificationChannel ch = new NotificationChannel(w.id, w.name, w.imp);
                  ch.setDescription("c".equals(w.kind) ? "Rings with the ringtone you picked in Zanply" : "Uses the tone, vibration and light you set in Zanply");
                  AudioAttributes aa = new AudioAttributes.Builder()
                          .setUsage("c".equals(w.kind) ? AudioAttributes.USAGE_NOTIFICATION_RINGTONE : AudioAttributes.USAGE_NOTIFICATION)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build();
                  if (w.sound == null) ch.setSound(null, null); else ch.setSound(w.sound, aa);
                  if (w.vib != null) { ch.enableVibration(true); ch.setVibrationPattern(w.vib); } else ch.enableVibration(false);
                  if (w.light != 0) { ch.enableLights(true); ch.setLightColor(w.light); } else ch.enableLights(false);
                  ch.setLockscreenVisibility("c".equals(w.kind) ? Notification.VISIBILITY_PUBLIC : Notification.VISIBILITY_PRIVATE);
                  nm.createNotificationChannel(ch);
                  return w.id;
              }

              /** The id of the messages channel for the current settings (the web page sends it to the server). */
              static String msgChannel(Context c) { return want(c, "m", screenOn(c)).id; }

              static void ensureChannels(Context c) {
                  NotificationManager nm = c.getSystemService(NotificationManager.class);
                  if (nm == null) return;
                  boolean s = screenOn(c);
                  Set<String> keep = new HashSet<>();
                  keep.add(channel(c, want(c, "m", s)));
                  keep.add(channel(c, want(c, "g", s)));
                  keep.add(channel(c, want(c, "c", true)));
                  keep.add(want(c, "m", true).id); keep.add(want(c, "m", false).id);
                  keep.add(want(c, "g", true).id); keep.add(want(c, "g", false).id);
                  try { // remove channels of settings that are no longer chosen (and the old fixed ones)
                      for (NotificationChannel x : nm.getNotificationChannels()) {
                          String id = x.getId();
                          boolean ours = id.startsWith("zm_") || id.startsWith("zg_") || id.startsWith("zc_") || id.startsWith("messages_") || id.equals("calls_v1");
                          if (ours && !keep.contains(id)) nm.deleteNotificationChannel(id);
                      }
                  } catch (Exception ignored) { }
              }

              static String describe(Want w) {
                  return "popup " + (w.imp >= NotificationManager.IMPORTANCE_HIGH ? "on" : "off") + ", tone " + (w.sound == null ? "off" : "on")
                          + ", vibrate " + (w.vib == null ? "off" : "on") + ", light " + (w.light == 0 ? "off" : "on");
              }

              /** For the "Check notifications" screen: what Zanply asked for next to what the phone really has. */
              static JSONObject diagChannels(Context c) {
                  JSONObject out = new JSONObject();
                  NotificationManager nm = c.getSystemService(NotificationManager.class);
                  for (String k : new String[]{"m", "g", "c"}) {
                      try {
                          Want w = want(c, k, screenOn(c));
                          JSONObject a = new JSONObject();
                          a.put("imp", w.imp); a.put("sound", w.sound != null); a.put("vib", w.vib != null); a.put("light", w.light != 0);
                          NotificationChannel ch = nm == null ? null : nm.getNotificationChannel(w.id);
                          JSONObject g = new JSONObject();
                          g.put("exists", ch != null);
                          if (ch != null) { g.put("imp", ch.getImportance()); g.put("sound", ch.getSound() != null); g.put("vib", ch.shouldVibrate()); g.put("light", ch.shouldShowLights()); }
                          JSONObject o = new JSONObject();
                          o.put("want", a); o.put("got", g);
                          out.put(k, o);
                      } catch (Exception ignored) { }
                  }
                  return out;
              }

              /** The name saved in the phone's own Contacts for this number (like WhatsApp). null = not saved or no permission. */
              static String contactName(Context c, String phone) {
                  try {
                      if (phone == null || phone.length() == 0 || phone.startsWith("g:")) return null;
                      if (c.checkSelfPermission(Manifest.permission.READ_CONTACTS) != PackageManager.PERMISSION_GRANTED) return null;
                      Uri u = Uri.withAppendedPath(android.provider.ContactsContract.PhoneLookup.CONTENT_FILTER_URI, Uri.encode(phone));
                      android.database.Cursor cu = c.getContentResolver().query(u, new String[]{android.provider.ContactsContract.PhoneLookup.DISPLAY_NAME}, null, null, null);
                      if (cu != null) {
                          try { if (cu.moveToFirst()) { String n = cu.getString(0); if (n != null && n.length() > 0) return n; } } finally { cu.close(); }
                      }
                  } catch (Exception ignored) { }
                  return null;
              }

              /* ---------------- the round picture (profile photo, or a coloured letter) ---------------- */

              static Bitmap avatar(String name, String photo) {
                  int sz = 192;
                  Bitmap src = null;
                  if (photo != null && photo.startsWith("https://")) {
                      try {
                          HttpURLConnection h = (HttpURLConnection) new URL(photo).openConnection();
                          h.setConnectTimeout(4000);
                          h.setReadTimeout(4000);
                          InputStream in = h.getInputStream();
                          src = BitmapFactory.decodeStream(in);
                          in.close();
                          h.disconnect();
                      } catch (Exception e) { src = null; }
                  }
                  Bitmap out = Bitmap.createBitmap(sz, sz, Bitmap.Config.ARGB_8888);
                  Canvas cv = new Canvas(out);
                  Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  if (src != null) {
                      int w = src.getWidth(), h = src.getHeight(), s = Math.min(w, h);
                      Rect from = new Rect((w - s) / 2, (h - s) / 2, (w - s) / 2 + s, (h - s) / 2 + s);
                      cv.drawCircle(sz / 2f, sz / 2f, sz / 2f, p);
                      p.setXfermode(new PorterDuffXfermode(PorterDuff.Mode.SRC_IN));
                      cv.drawBitmap(src, from, new Rect(0, 0, sz, sz), p);
                      p.setXfermode(null);
                  } else {
                      int[] cols = {0xFF1F8F5F, 0xFF3B82F6, 0xFF8B5CF6, 0xFFEF4444, 0xFFF59E0B, 0xFF0EA5A5, 0xFFD946EF};
                      String n = name == null ? "" : name.replaceFirst("^[+\\s]+", "");
                      if (n.length() == 0) n = "?";
                      p.setColor(cols[Math.abs(n.hashCode()) % cols.length]);
                      cv.drawCircle(sz / 2f, sz / 2f, sz / 2f, p);
                      p.setColor(Color.WHITE);
                      p.setTextAlign(Paint.Align.CENTER);
                      p.setTextSize(sz * 0.46f);
                      String letter = n.substring(0, n.offsetByCodePoints(0, 1)).toUpperCase();
                      cv.drawText(letter, sz / 2f, sz / 2f - (p.descent() + p.ascent()) / 2f, p);
                  }
                  return out;
              }

              /* ---------------- messages ---------------- */

              static void showMessage(Context c, String from, String title, String body, String photo, boolean group, boolean react) {
                  NotificationManager nm = c.getSystemService(NotificationManager.class);
                  if (nm == null) return;
                  String who = (title == null || title.length() == 0) ? "Zanply" : title;
                  String f = from == null ? "" : from;
                  JSONObject p = prefs(c);
                  String k = group ? "g" : "m";

                  if (!nm.areNotificationsEnabled()) { Store.log(c, "NOT SHOWN (" + who + "): notifications are switched OFF for Zanply in the phone settings."); return; }
                  if (Build.VERSION.SDK_INT >= 33 && c.checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      Store.log(c, "NOT SHOWN (" + who + "): Zanply has no permission to show notifications.");
                      return;
                  }
                  if (react && !p.optBoolean(k + "_react", true)) { Store.log(c, "Not shown: reaction from " + who + " - Reaction notifications are OFF in Zanply."); return; }
                  if (Store.muteGet(c, f) > System.currentTimeMillis()) { Store.log(c, "Not shown: " + who + " is muted."); return; }

                  Want w = want(c, k, screenOn(c));
                  String ch = channel(c, w);
                  try {
                      NotificationChannel live = nm.getNotificationChannel(ch);
                      if (live != null && live.getImportance() == NotificationManager.IMPORTANCE_NONE) {
                          Store.log(c, "NOT SHOWN (" + who + "): this notification type is turned OFF in the phone settings (Zanply > Notifications).");
                          return;
                      }
                  } catch (Exception ignored) { }

                  Bitmap av = avatar(who, photo);
                  int id = f.hashCode();
                  JSONArray hist = Store.histAdd(c, f, body, System.currentTimeMillis());

                  Intent open = new Intent(c, MainActivity.class).setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP).putExtra("chat", f);
                  int fl = PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE;
                  PendingIntent pi = PendingIntent.getActivity(c, id, open, fl);
                  RemoteInput ri = new RemoteInput.Builder(CallReceiver.KEY_REPLY).setLabel("Reply").build();
                  // an inline reply needs a MUTABLE pending intent so Android can put the typed text into it
                  PendingIntent replyPi = PendingIntent.getBroadcast(c, id + 1, new Intent(c, CallReceiver.class).setAction(CallReceiver.ACTION_REPLY).putExtra("from", f).putExtra("nid", id).putExtra("who", who),
                          PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= 31 ? PendingIntent.FLAG_MUTABLE : 0));
                  PendingIntent readPi = PendingIntent.getBroadcast(c, id + 2, new Intent(c, CallReceiver.class).setAction(CallReceiver.ACTION_READ).putExtra("from", f).putExtra("nid", id), fl);
                  PendingIntent mutePi = PendingIntent.getBroadcast(c, id + 3, new Intent(c, CallReceiver.class).setAction(CallReceiver.ACTION_MUTE).putExtra("from", f).putExtra("nid", id).putExtra("who", who), fl);
                  Icon ai = Icon.createWithResource(c, R.drawable.ic_stat);

                  Notification.Builder b = new Notification.Builder(c, ch)
                          .setSmallIcon(R.drawable.ic_stat)
                          .setLargeIcon(av)
                          .setColor(0xFF1F8F5F)
                          .setContentTitle(who)
                          .setContentText(body)
                          .setWhen(System.currentTimeMillis())
                          .setShowWhen(true)
                          .setCategory(Notification.CATEGORY_MESSAGE)
                          .setAutoCancel(true)
                          .setContentIntent(pi)
                          .addAction(new Notification.Action.Builder(ai, "Reply", replyPi).addRemoteInput(ri).setAllowGeneratedReplies(true).build())
                          .addAction(new Notification.Action.Builder(ai, "Mark as read", readPi).build())
                          .addAction(new Notification.Action.Builder(ai, "Mute", mutePi).build());
                  if (Build.VERSION.SDK_INT >= 28) {
                      try {
                          Person me = new Person.Builder().setName("You").build();
                          Person them = new Person.Builder().setName(who).setIcon(Icon.createWithBitmap(av)).build();
                          Notification.MessagingStyle ms = new Notification.MessagingStyle(me);
                          if (group) { ms.setConversationTitle(who); ms.setGroupConversation(true); }
                          for (int i = 0; i < hist.length(); i++) {
                              JSONObject o = hist.getJSONObject(i);
                              ms.addMessage(o.optString("x"), o.optLong("t"), them);
                          }
                          b.setStyle(ms);
                      } catch (Exception e) { b.setStyle(new Notification.BigTextStyle().bigText(body)); }
                  } else {
                      b.setStyle(new Notification.BigTextStyle().bigText(body));
                  }
                  nm.notify(id, b.build());
                  Store.log(c, "Shown: " + who + " (" + describe(w) + ")" + (w.sound == null ? " - no tone because " + (p.optBoolean("tones", true) ? "the tone is set to Silent" : "Conversation tones is OFF") : ""));
                  if (p.optBoolean("reminders", true)) scheduleRemind(c);
              }

              /* ---------------- reminders (a second nudge about messages that are still unread) ---------------- */

              private static PendingIntent remindPi(Context c) {
                  return PendingIntent.getBroadcast(c, 77, new Intent(c, CallReceiver.class).setAction(CallReceiver.ACTION_REMIND),
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              static void scheduleRemind(Context c) {
                  try {
                      AlarmManager am = c.getSystemService(AlarmManager.class);
                      if (am != null) am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, System.currentTimeMillis() + 30L * 60L * 1000L, remindPi(c));
                  } catch (Exception ignored) { }
              }

              static void cancelRemind(Context c) {
                  try { AlarmManager am = c.getSystemService(AlarmManager.class); if (am != null) am.cancel(remindPi(c)); } catch (Exception ignored) { }
              }

              static void remind(Context c) {
                  try {
                      if (!prefs(c).optBoolean("reminders", true)) { Store.log(c, "Reminder skipped: Reminders are OFF in Zanply."); return; }
                      NotificationManager nm = c.getSystemService(NotificationManager.class);
                      if (nm == null) return;
                      int n = 0;
                      for (StatusBarNotification s : nm.getActiveNotifications()) if (s.getId() != CALL_ID && s.getId() != REMIND_ID) n++;
                      if (n == 0) return;
                      String ch = channel(c, want(c, "m", screenOn(c)));
                      PendingIntent pi = PendingIntent.getActivity(c, 78, new Intent(c, MainActivity.class).setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP),
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      Notification nn = new Notification.Builder(c, ch).setSmallIcon(R.drawable.ic_stat).setColor(0xFF1F8F5F)
                              .setContentTitle("Zanply").setContentText("You have " + n + " unread " + (n == 1 ? "chat" : "chats"))
                              .setAutoCancel(true).setContentIntent(pi).build();
                      nm.notify(REMIND_ID, nn);
                      Store.log(c, "Reminder shown (" + n + " unread).");
                  } catch (Exception ignored) { }
              }

              /* ---------------- calls ---------------- */

              static void showCall(Context c, String from, String name, String callBody, boolean video) {
                  NotificationManager nm = c.getSystemService(NotificationManager.class);
                  if (nm == null) return;
                  if (!nm.areNotificationsEnabled()) { Store.log(c, "NOT SHOWN (call from " + name + "): notifications are switched OFF for Zanply in the phone settings."); return; }
                  Want w = want(c, "c", true);
                  String ch = channel(c, w);
                  String text = video ? "Incoming video call" : "Incoming voice call";

                  Intent screen = new Intent(c, CallActivity.class)
                          .setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP)
                          .putExtra("from", from).putExtra("name", name).putExtra("call", callBody).putExtra("video", video);
                  PendingIntent screenPi = PendingIntent.getActivity(c, 11, screen, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                  Intent answer = new Intent(c, MainActivity.class)
                          .setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP)
                          .putExtra("answer_from", from).putExtra("answer_name", name).putExtra("answer_body", callBody);
                  PendingIntent answerPi = PendingIntent.getActivity(c, 12, answer, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                  Intent decline = new Intent(c, CallReceiver.class).setAction(CallReceiver.ACTION_DECLINE).putExtra("call", callBody);
                  PendingIntent declinePi = PendingIntent.getBroadcast(c, 13, decline, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                  Icon icon = Icon.createWithResource(c, R.drawable.ic_stat);
                  Notification n = new Notification.Builder(c, ch)
                          .setSmallIcon(R.drawable.ic_stat)
                          .setContentTitle(name)
                          .setContentText(text)
                          .setCategory(Notification.CATEGORY_CALL)
                          .setOngoing(true)
                          .setAutoCancel(false)
                          .setTimeoutAfter(40000)
                          .setContentIntent(screenPi)
                          .setFullScreenIntent(screenPi, true)
                          .addAction(new Notification.Action.Builder(icon, "Decline", declinePi).build())
                          .addAction(new Notification.Action.Builder(icon, "Answer", answerPi).build())
                          .build();
                  n.flags |= Notification.FLAG_INSISTENT; // keep ringing until answered, declined or timed out
                  nm.notify(CALL_ID, n);
                  Store.log(c, "Incoming " + (video ? "video" : "voice") + " call from " + name + " shown (" + describe(w) + ")");
              }

              static void cancelCall(Context c) {
                  NotificationManager nm = c.getSystemService(NotificationManager.class);
                  if (nm != null) nm.cancel(CALL_ID);
              }

              static void cancelAll(Context c) {
                  NotificationManager nm = c.getSystemService(NotificationManager.class);
                  if (nm != null) nm.cancelAll();
                  Store.histClear(c);
                  cancelRemind(c);
              }

          /** Inline reply: sends the typed text to the server as a normal message. Runs on a background thread. */
          /** Opens a connection on the phone's active network. Background code sometimes cannot use the default route, which shows up as "Unable to resolve host". */
          static HttpURLConnection openConn(Context c, String u) throws Exception {
              URL url = new URL(u);
              try {
                  android.net.ConnectivityManager cm = (android.net.ConnectivityManager) c.getSystemService(Context.CONNECTIVITY_SERVICE);
                  if (cm != null) {
                      android.net.Network n = cm.getActiveNetwork();
                      if (n != null) return (HttpURLConnection) n.openConnection(url);
                  }
              } catch (Exception ignored) { }
              return (HttpURLConnection) url.openConnection();
          }

          /** Tries up to 3 times, because the network is often still waking up when the reply button is tapped. */
          static boolean sendReplyOnServer(Context c, String to, String text) {
              for (int i = 0; i < 3; i++) {
                  if (sendReplyOnce(c, to, text)) return true;
                  try { Thread.sleep(2500); } catch (InterruptedException ignored) { }
              }
              return false;
          }
          static boolean sendReplyOnce(Context c, String to, String text) {
              try {
                  String tok = Store.getStr(c, "session", ""), base = Store.getStr(c, "apiBase", "");
                  if (tok.length() == 0 || base.length() == 0 || to == null || to.length() == 0) { Store.log(c, "Reply not sent: no saved sign-in. Open Zanply once."); return false; }
                  JSONObject o = new JSONObject();
                  o.put("action", "send");
                  o.put("token", tok);
                  o.put("to", to);
                  o.put("body", text);
                  HttpURLConnection h = openConn(c, base + "/chat");
                  h.setRequestMethod("POST");
                  h.setRequestProperty("Content-Type", "application/json");
                  h.setConnectTimeout(8000);
                  h.setReadTimeout(8000);
                  h.setDoOutput(true);
                  h.getOutputStream().write(o.toString().getBytes("UTF-8"));
                  int code = h.getResponseCode();
                  h.disconnect();
                  Store.log(c, code == 200 ? "Reply sent from the notification." : "Reply failed (server said " + code + ").");
                  return code == 200;
              } catch (Exception e) {
                  Store.log(c, "Reply failed: " + e.getMessage());
                  return false;
              }
          }

          static void replyFailed(Context c, String from, String who) {
              try {
                  NotificationManager nm = c.getSystemService(NotificationManager.class);
                  if (nm == null) return;
                  String ch = channel(c, want(c, "m", screenOn(c)));
                  PendingIntent pi = PendingIntent.getActivity(c, 79, new Intent(c, MainActivity.class).setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP).putExtra("chat", from),
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  Notification n = new Notification.Builder(c, ch).setSmallIcon(R.drawable.ic_stat).setColor(0xFF1F8F5F)
                          .setContentTitle("Reply not sent").setContentText("Tap to open the chat with " + (who == null || who.length() == 0 ? "this contact" : who))
                          .setAutoCancel(true).setContentIntent(pi).build();
                  nm.notify(REMIND_ID + 1, n);
              } catch (Exception ignored) { }
          }

              /** "Mark as read": tells the server the chat was read (so the other person gets blue ticks). Runs on a background thread. */
              static void markReadOnServer(Context c, String from) {
                  try {
                      String tok = Store.getStr(c, "session", ""), base = Store.getStr(c, "apiBase", "");
                      if (tok.length() == 0 || base.length() == 0 || from == null || from.startsWith("g:") || from.length() == 0) return;
                      JSONObject o = new JSONObject();
                      o.put("action", "history");
                      o.put("token", tok);
                      o.put("with", from);
                      o.put("after", 2147483647);
                      HttpURLConnection h = openConn(c, base + "/chat");
                      h.setRequestMethod("POST");
                      h.setRequestProperty("Content-Type", "application/json");
                      h.setConnectTimeout(6000);
                      h.setReadTimeout(6000);
                      h.setDoOutput(true);
                      h.getOutputStream().write(o.toString().getBytes("UTF-8"));
                      int code = h.getResponseCode();
                      h.disconnect();
                      Store.log(c, code == 200 ? "Marked as read on the server." : "Mark as read failed (server said " + code + ").");
                  } catch (Exception e) {
                      Store.log(c, "Mark as read failed: " + e.getMessage());
                  }
              }
          }
