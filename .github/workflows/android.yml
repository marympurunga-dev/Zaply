          cat > app/src/main/java/com/zanply/app/Notifs.java <<'ZEOF'
          package com.zanply.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.drawable.Icon;
          import android.net.Uri;
          import android.media.AudioAttributes;
          import android.provider.Settings;

          /** Builds the message and incoming-call notifications. The sounds are the phone's own default sounds. */
          final class Notifs {
              static final String CH_CALLS = "calls_v1";
              static final String CH_MSG = "messages_v1";
              static final int CALL_ID = 4242;

              /** The messages channel. A channel's sound cannot change once created, so each chosen tone gets its own channel id. */
          static String msgChannel(Context c) {
              String u = Store.getStr(c, "toneUri", "");
              return u.length() == 0 ? CH_MSG : "messages_t" + Integer.toHexString(u.hashCode());
          }

          /** null = silent */
          static Uri toneUri(Context c) {
              String u = Store.getStr(c, "toneUri", "");
              if (u.length() == 0) return Settings.System.DEFAULT_NOTIFICATION_URI;
              if (u.equals("silent")) return null;
              return Uri.parse(u);
          }

          static void ensureChannels(Context c) {
                  NotificationManager nm = c.getSystemService(NotificationManager.class);
                  if (nm == null) return;

                  NotificationChannel calls = new NotificationChannel(CH_CALLS, "Incoming calls", NotificationManager.IMPORTANCE_HIGH);
                  calls.setDescription("Rings with your phone's ringtone");
                  calls.setSound(Settings.System.DEFAULT_RINGTONE_URI, new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build());
                  calls.enableVibration(true);
                  calls.setVibrationPattern(new long[]{0, 700, 500, 700, 500, 700, 500, 700});
                  calls.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                  nm.createNotificationChannel(calls);

                  NotificationChannel msg = new NotificationChannel(msgChannel(c), "Messages", NotificationManager.IMPORTANCE_HIGH);
                  msg.setDescription("Uses your phone's notification sound");
                  msg.setSound(toneUri(c), new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_NOTIFICATION)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build());
                  msg.enableVibration(true);
                  msg.setLockscreenVisibility(Notification.VISIBILITY_PRIVATE);
                  nm.createNotificationChannel(msg);
                  try { // remove channels of tones that are no longer chosen
                      for (NotificationChannel x : nm.getNotificationChannels()) {
                          if (x.getId().startsWith("messages_t") && !x.getId().equals(msgChannel(c))) nm.deleteNotificationChannel(x.getId());
                      }
                      if (!msgChannel(c).equals(CH_MSG)) nm.deleteNotificationChannel(CH_MSG);
                  } catch (Exception ignored) { }
              }

              static void showMessage(Context c, String from, String title, String body) {
                  ensureChannels(c);
                  Intent open = new Intent(c, MainActivity.class)
                          .setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP)
                          .putExtra("chat", from == null ? "" : from);
                  int id = from == null ? 1 : from.hashCode();
                  PendingIntent pi = PendingIntent.getActivity(c, id, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  Notification n = new Notification.Builder(c, msgChannel(c))
                          .setSmallIcon(R.drawable.ic_stat)
                          .setContentTitle(title)
                          .setContentText(body)
                          .setStyle(new Notification.BigTextStyle().bigText(body))
                          .setCategory(Notification.CATEGORY_MESSAGE)
                          .setAutoCancel(true)
                          .setContentIntent(pi)
                          .build();
                  NotificationManager nm = c.getSystemService(NotificationManager.class);
                  if (nm != null) nm.notify(id, n);
              }

              static void showCall(Context c, String from, String name, String callBody, boolean video) {
                  ensureChannels(c);
                  String text = video ? "Incoming video call" : "Incoming voice call";

                  Intent screen = new Intent(c, CallActivity.class)
                          .setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP)
                          .putExtra("from", from).putExtra("name", name).putExtra("call", callBody).putExtra("video", video);
                  PendingIntent screenPi = PendingIntent.getActivity(c, 11, screen, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                  Intent answer = new Intent(c, MainActivity.class)
                          .setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP)
                          .putExtra("answer_from", from).putExtra("answer_name", name).putExtra("answer_body", callBody);
                  PendingIntent answerPi = PendingIntent.getActivity(c, 12, answer, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                  Intent decline = new Intent(c, CallReceiver.class).setAction(CallReceiver.ACTION_DECLINE).putExtra("call", callBody);
                  PendingIntent declinePi = PendingIntent.getBroadcast(c, 13, decline, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                  Icon icon = Icon.createWithResource(c, R.drawable.ic_stat);
                  Notification n = new Notification.Builder(c, CH_CALLS)
                          .setSmallIcon(R.drawable.ic_stat)
                          .setContentTitle(name)
                          .setContentText(text)
                          .setCategory(Notification.CATEGORY_CALL)
                          .setOngoing(true)
                          .setAutoCancel(false)
                          .setTimeoutAfter(40000)
                          .setContentIntent(screenPi)
                          .setFullScreenIntent(screenPi, true)
                          .addAction(new Notification.Action.Builder(icon, "Decline", declinePi).build())
                          .addAction(new Notification.Action.Builder(icon, "Answer", answerPi).build())
                          .build();
                  n.flags |= Notification.FLAG_INSISTENT; // keep ringing until answered, declined or timed out
                  NotificationManager nm = c.getSystemService(NotificationManager.class);
                  if (nm != null) nm.notify(CALL_ID, n);
              }

              static void cancelCall(Context c) {
                  NotificationManager nm = c.getSystemService(NotificationManager.class);
                  if (nm != null) nm.cancel(CALL_ID);
              }

              static void cancelAll(Context c) {
                  NotificationManager nm = c.getSystemService(NotificationManager.class);
                  if (nm != null) nm.cancelAll();
              }
          }
