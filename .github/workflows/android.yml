                  /** Writes a text file into the phone's Downloads/Zanply folder. Returns where it was saved, or "" on failure. */
                  @JavascriptInterface public String saveTextFile(String name, String text) {
                      try {
                          String safe = (name == null ? "zanply" : name).replaceAll("[^A-Za-z0-9._ -]", "_");
                          byte[] data = (text == null ? "" : text).getBytes("UTF-8");
                          if (Build.VERSION.SDK_INT >= 29) {
                              ContentValues v = new ContentValues();
                              v.put(MediaStore.MediaColumns.DISPLAY_NAME, safe);
                              v.put(MediaStore.MediaColumns.MIME_TYPE, "text/plain");
                              v.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/Zanply");
                              Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                              if (u == null) return "";
                              OutputStream os = getContentResolver().openOutputStream(u);
                              if (os == null) return "";
                              os.write(data);
                              os.close();
                              return "Downloads/Zanply/" + safe;
                          }
                          File dir = getExternalFilesDir(Environment.DIRECTORY_DOCUMENTS);
