      - name: Stamp the build number into the app version
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName '1.0'/versionName '2.${{ github.run_number }}'/" android-app/app/build.gradle
          grep -n "versionCode\|versionName" android-app/app/build.gradle

      - name: Build the APK
        working-directory: android-app
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp android-app/app/build/outputs/apk/release/app-release.apk zanply.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zanply-apk
          path: zanply.apk

      - name: Publish the APK so it can be downloaded on the phone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Zanply Android app (build ${{ github.run_number }})
          files: zanply.apk
