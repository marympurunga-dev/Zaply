          /** Opens end-to-end encrypted messages for notifications. The page hands over each chat's key (setChatKey); the server only forwards scrambled text. */
          final class Crypt {
              static synchronized void saveKey(Context c, String phone, String keyB64, String me) {
                  if (phone == null || phone.length() == 0 || keyB64 == null || keyB64.length() == 0) return;
                  try {
                      JSONObject o = new JSONObject(Store.getStr(c, "ckeys", "{}"));
                      o.put(phone, keyB64);
                      Store.putStr(c, "ckeys", o.toString());
                      if (me != null && me.length() > 0) Store.putStr(c, "mephone", me);
                  } catch (Exception ignored) { }
              }

              static synchronized void clear(Context c) {
                  Store.putStr(c, "ckeys", "{}");
                  Store.putStr(c, "mephone", "");
                  Store.histClear(c);
              }

              /** The readable text, or null when it cannot be opened here (no key yet, key changed, not encrypted). */
              static String decrypt(Context c, String from, String me, String wire) {
                  try {
                      if (wire == null || !wire.startsWith("e2e1:") || from == null || from.length() == 0) return null;
                      String kb = new JSONObject(Store.getStr(c, "ckeys", "{}")).optString(from, "");
                      if (kb.length() == 0) return null;
                      String mine = (me != null && me.length() > 0) ? me : Store.getStr(c, "mephone", "");
                      if (mine.length() == 0) return null;
                      byte[] all = Base64.decode(wire.substring(5), Base64.DEFAULT);
                      if (all.length < 29) return null;
                      byte[] key = Base64.decode(kb, Base64.DEFAULT);
                      String[] pair = {mine, from};
                      Arrays.sort(pair);
                      Cipher ci = Cipher.getInstance("AES/GCM/NoPadding");
                      ci.init(Cipher.DECRYPT_MODE, new SecretKeySpec(key, "AES"), new GCMParameterSpec(128, all, 0, 12));
                      ci.updateAAD((pair[0] + "|" + pair[1]).getBytes("UTF-8"));
                      return new String(ci.doFinal(all, 12, all.length - 12), "UTF-8");
                  } catch (Exception e) { return null; }
              }

              /** Same wording the server uses for messages it can read. */
              static String preview(String t) {
                  if (t.startsWith("__call__")) return "Incoming call";
                  if (t.startsWith("__media__")) return "Sent an attachment";
                  if (t.startsWith("__loc__")) return "Shared a location";
                  if (t.startsWith("__game__")) return "Game move";
                  return t.length() > 140 ? t.substring(0, 140) : t;
              }
          }
