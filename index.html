    .stk-h{width:44px;height:5px;border-radius:3px;background:#555;margin:10px auto 6px;flex:none}
    .stk-tabs{display:flex;margin:6px 16px 8px;border:1px solid #333;border-radius:20px;overflow:hidden;flex:none}
    .stk-tabs button{flex:1;border:none;background:transparent;color:#fff;padding:10px;font-size:16px;font-weight:700}
    .stk-tabs button.on{background:#2a3942}
    .stk-body{flex:1;overflow-y:auto;padding:4px 12px calc(env(safe-area-inset-bottom,0px) + 16px)}
    .stk-body h4{margin:14px 4px 8px;color:#aab;font-size:14px}
    .stk-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
    .stk-g button{border:none;background:transparent;font-size:30px;padding:6px 0;color:#fff}
    .stk-row{display:flex;gap:12px;flex-wrap:wrap}
    .stk-row button{border:none;background:transparent;padding:4px}
    .stk-pill{background:#fff!important;color:#000;border-radius:24px!important;padding:10px 18px!important;font-size:20px;font-weight:700}
    .stk-row svg{width:64px;height:64px;display:block}
    #cedCrop{background:#0b141a}
    #ccStage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px;overflow:hidden}
    #ccWrap{position:relative;line-height:0;touch-action:none}
    #ccCv{display:block}
    #ccBox{position:absolute;border:2px solid #fff;box-shadow:0 0 0 2000px rgba(0,0,0,.6);touch-action:none;background:linear-gradient(to right,transparent calc(33.33% - .5px),rgba(255,255,255,.55) 0 calc(33.33% + .5px),transparent 0 calc(66.66% - .5px),rgba(255,255,255,.55) 0 calc(66.66% + .5px),transparent 0),linear-gradient(to bottom,transparent calc(33.33% - .5px),rgba(255,255,255,.55) 0 calc(33.33% + .5px),transparent 0 calc(66.66% - .5px),rgba(255,255,255,.55) 0 calc(66.66% + .5px),transparent 0)}
    #ccBox i{position:absolute;width:44px;height:44px;border:0 solid #fff}
    #ccBox i[data-h=tl]{left:-3px;top:-3px;border-top-width:5px;border-left-width:5px}
    #ccBox i[data-h=tr]{right:-3px;top:-3px;border-top-width:5px;border-right-width:5px}
    #ccBox i[data-h=bl]{left:-3px;bottom:-3px;border-bottom-width:5px;border-left-width:5px}
    #ccBox i[data-h=br]{right:-3px;bottom:-3px;border-bottom-width:5px;border-right-width:5px}
    .cc-bar{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:12px 24px calc(env(safe-area-inset-bottom,0px) + 18px);background:#0b141a}
    .cc-bar button{border:none;background:transparent;color:#25d366;font-size:17px;font-weight:700;padding:8px}
    #ccRot{color:#fff}
    .mcap{padding:6px 4px 2px;font-size:15px;line-height:1.35;white-space:pre-wrap;word-break:break-word}
    .mvo{border:none;background:transparent;color:inherit;font:inherit;font-weight:600;padding:12px 14px;display:flex;gap:8px;align-items:center}
    .mvo:disabled{opacity:.65}

    /* settings pages */
    .zpg{position:fixed;inset:0;z-index:60;background:var(--bg);color:var(--text);display:flex;flex-direction:column;animation:zpgin .8s ease both}
    @keyframes zpgin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .zpg-h{display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 12px;font-size:20px;font-weight:700;border-bottom:1px solid var(--border)}
    .zpg-h button{border:none;background:transparent;color:inherit;padding:4px;display:flex}
    .zpg-b{flex:1;overflow-y:auto;padding:6px 0 30px}
    .zrow{display:flex;align-items:center;gap:18px;width:100%;border:none;background:transparent;color:inherit;text-align:left;padding:15px 20px;font-size:16px;border-radius:0}
    .zrow svg{flex:none;opacity:.8}
    .zrow.red{color:#ff5a5f}
    .zsep{height:1px;background:var(--border);margin:6px 0}
    .zempty{padding:40px 24px;text-align:center;color:var(--muted);line-height:1.6}
    .zempty button{margin-top:16px}

    .zin{width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font:inherit;font-size:16px}
    .zin[readonly]{opacity:.75}
    .zav{width:104px;height:104px;border-radius:50%;margin:6px auto 8px;background:#1fb5a8 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:42px;color:#fff;font-weight:700}
    .zline{display:flex;gap:8px;align-items:center}.zline .zin{flex:1;min-width:0}.zline button{flex:none}
    .zpop{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:24px}
    .zpop>div{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;max-width:340px;width:100%;line-height:1.5}

    .ld{z-index:200!important}.zpop{z-index:210!important}
    .zsw{flex:none;width:50px;height:28px;border-radius:999px;padding:0;border:2px solid var(--border);background:rgba(128,128,128,.35);position:relative}
    .zsw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#9aa3ad;transition:.15s}
    .zsw.on{background:var(--acc,#21c063);border-color:var(--acc,#21c063)}.zsw.on::after{left:24px;background:#fff}
    .zsec{padding:16px 20px 6px;font-size:13px;color:var(--muted);font-weight:600}
    .zfoot{padding:12px 20px;font-size:13px;color:var(--muted);line-height:1.5}
    .zrad .zdot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--muted)}
    .zrad.on .zdot{border-color:var(--acc,#21c063);box-shadow:inset 0 0 0 4px var(--bg),inset 0 0 0 20px var(--acc,#21c063)}
    .zth{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 16px}
    .zth>button{height:130px;border-radius:12px;border:2px solid transparent;padding:8px;display:flex;flex-direction:column;gap:6px;justify-content:center;position:relative}
    .zth>button.on{border-color:#fff;outline:2px solid var(--acc,#21c063)}
    .zth i{display:block;height:18px;border-radius:8px;background:rgba(40,40,40,.85);width:70%}.zth i.m{align-self:flex-end;background:var(--mc)}
    .zlock{position:fixed;inset:0;z-index:300;background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
    .zbtn2{margin:12px 20px 0;width:calc(100% - 40px)}
    .bub.mine{background:var(--thmine,var(--acc,#21c063));border-color:var(--thmine,var(--acc,#21c063));color:var(--thtxt,#06140c)}
    .bub{font-size:var(--msgfs,16px)}
    .zpop .zline{margin-top:16px}.zpop .zline button{flex:1}
    .zmsg{color:#ff5a5f;font-size:14px;min-height:18px;margin-top:10px}

    .zhead{display:flex;flex-direction:column;align-items:center;padding:22px 20px 18px}
    .zavw{position:relative;width:124px;height:124px;cursor:pointer}
    .zavw .zav{width:124px;height:124px;margin:0;font-size:52px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
    .zavw.busy .zav{opacity:.5}
    .zcam{position:absolute;right:0;bottom:2px;width:40px;height:40px;border-radius:50%;background:var(--acc,#21c063);color:#fff;border:3px solid var(--bg);display:flex;align-items:center;justify-content:center;padding:0}
    .zhead h3{margin:14px 0 2px;font-size:20px}
    .zhead .sub{margin:0}
    .zcard{background:var(--card);border:1px solid var(--border);border-radius:16px;margin:0 16px 16px;overflow:hidden}
    .zcard-t{margin:14px 20px 8px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
    .zir{display:flex;align-items:center;gap:16px;width:100%;border:none;border-radius:0;background:transparent;color:inherit;text-align:left;padding:14px 16px}
    .zir+.zir{border-top:1px solid var(--border)}
    .zir>svg{flex:none;color:var(--muted)}
    .zir .zt{flex:1;min-width:0}
    .zir .zl{font-size:12.5px;color:var(--muted);margin-bottom:2px}
    .zir .zv{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:pre-wrap;word-break:break-word}
    .zir .zv.empty{color:var(--accent);opacity:.9}
    .zok{display:inline-block;margin-left:8px;font-size:11px;font-weight:700;color:var(--acc,#21c063);border:1px solid var(--acc,#21c063);border-radius:8px;padding:1px 6px;vertical-align:middle}
    /* AI image page */
    .ai{padding:16px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
    .ai-hero{display:flex;gap:14px;align-items:center}
    .ai-ico{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--accent),#a855f7);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
    .ai-hero h2{margin:0;font-size:19px}
    .ai-hero p{margin:2px 0 0;color:var(--muted);font-size:13.5px;line-height:1.4}
    .ai-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 14px}
    .ai-card label{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
    .ai-card textarea{width:100%;border:none;outline:none;background:transparent;color:var(--text);font:inherit;font-size:16px;line-height:1.45;resize:none;padding:8px 0 0;margin:0;box-sizing:border-box;border-radius:0}
    .ai-count{text-align:right;font-size:12px;color:var(--muted)}
    .ai-lbl{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:2px 0 -6px}
    .ai-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
    .ai-chips::-webkit-scrollbar{display:none}
    .ai-chips button{flex:none;width:auto;border-radius:999px;padding:8px 14px;font-size:13.5px}
    .ai-skel{aspect-ratio:1;width:100%;border-radius:16px;border:1px solid var(--border);background:linear-gradient(110deg,var(--card) 30%,var(--border) 50%,var(--card) 70%);background-size:200% 100%;animation:aisk 1.2s linear infinite}
    .ai-skel.hidden{display:none}
    @keyframes aisk{to{background-position:-200% 0}}
    .ai-res{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:10px}
    .ai-note{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:12.5px;line-height:1.5;padding:2px 2px 8px}
    .ai-note svg{flex:none;margin-top:1px}
    #incoming.icvid #icAv{width:118px;height:118px;font-size:46px}
    #icVidOff{display:flex;align-items:center;gap:10px;background:rgba(20,26,30,.85);color:#fff;border:none;border-radius:999px;padding:12px 18px;font:inherit;font-size:15px;font-weight:600}
    #icVidOff.hidden{display:none}
    .ic-bar{display:flex;justify-content:space-around;width:100%;max-width:420px}
    .ic-b{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:12.5px;flex:1;text-align:center}
    .ic-b:nth-child(2){flex:1.5}
    .ic-b span{white-space:nowrap}
    .ic-b .rnd{width:68px;height:68px;padding:0;display:flex;align-items:center;justify-content:center;color:#fff;touch-action:none}

    /* ===== message box: idle (+ camera photos mic | Message | thumbs-up), typing (> | bigger Message | send) ===== */
    .comp{gap:2px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));align-items:center}
    .comp .ghost{display:flex;align-items:center;justify-content:center;width:42px;height:42px;padding:0;border:none;border-radius:50%;background:transparent;color:#25d366;flex:none}
    .comp .cl{display:flex;align-items:center;flex:none;overflow:hidden;max-width:200px;opacity:1;transition:max-width .2s ease,opacity .15s ease}
    .comp.typing .cl{max-width:0;opacity:0;pointer-events:none}
    .comp #btnExpand{display:none;width:34px}
    .comp.typing #btnExpand{display:flex}
    .comp .inbox{flex:1 1 auto;min-width:0;display:flex;align-items:center;background:rgba(127,127,127,.2);border-radius:26px;padding-right:2px}
    .comp .inbox input{flex:1 1 auto;width:100%;min-width:0;margin:0;border:none;border-radius:0;background:transparent;padding:13px 6px 13px 16px;font-size:16px;transition:padding .15s ease,font-size .15s ease}
    .comp.typing .inbox input{padding:16px 6px 16px 18px;font-size:18px}
    .comp .inbox input:focus{outline:none}
    .comp .inbox .ghost{width:38px;height:38px}
    .comp #btnLike{display:flex}
    .comp #btnSendMsg{display:none;width:44px;height:44px;border:none;background:#25d366;color:#06140c;align-items:center;justify-content:center;padding:0}
    .comp.hastext #btnLike{display:none}
    .comp.hastext #btnSendMsg{display:flex}

    /* ===== + menu ===== */
    .plusmenu{left:10px;bottom:calc(72px + env(safe-area-inset-bottom,0px));border-radius:20px;padding:8px 0;min-width:230px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
    .plusmenu button{display:flex;align-items:center;gap:20px;width:100%;padding:15px 22px;font-size:18px;border-radius:0;color:var(--text)}
    .plusmenu button svg{width:26px;height:26px;flex:none;color:#25d366}

    /* ===== contact profile page ===== */
    #profileView{z-index:10}
    .pv{flex:1;overflow-y:auto;padding:0 0 calc(40px + env(safe-area-inset-bottom,0px))}
    .pv-top{display:flex;flex-direction:column;align-items:center;padding:14px 16px 20px}
    .pv-top .av.big{width:112px;height:112px;font-size:46px}
    .si-top{padding:6px 16px 14px}
    .si-top .av.big{width:96px;height:96px;font-size:40px}
    .pv-name{margin-top:14px;font-size:23px;font-weight:700;text-align:center;word-break:break-word}
    .pv-card{margin:0 16px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:4px 18px}
    .prow{display:flex;align-items:flex-start;gap:16px;padding:14px 0;border-bottom:1px solid var(--border)}
    .prow:last-child{border-bottom:none}
    .prow svg{flex:none;width:24px;height:24px;margin-top:1px;color:#25d366}
    .prow div{flex:1;min-width:0}
    .prow b{display:block;font-size:17px;font-weight:600;word-break:break-word;white-space:pre-wrap}
    .prow b.none{color:var(--muted);font-weight:400}
    .prow small{display:block;margin-top:2px;color:var(--muted);font-size:13px}

    /* ===== my profile editor ===== */
    .pfedit{margin-top:12px;text-align:left}
    .pfedit h4{margin:0 0 12px;font-size:15px}
    .pfin{display:flex;align-items:center;gap:12px;margin-bottom:12px}
    .pfin svg{flex:none;width:24px;height:24px;color:#25d366}
    .pfin input,.pfin textarea{flex:1;width:auto;min-width:0;margin:0;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--text)}
    .pfin textarea{resize:none;width:100%}
    .pfin input[type=date]{min-height:48px}
    .pfcount{text-align:right;color:var(--muted);font-size:12px;margin:-6px 0 12px}

    /* ===== calls list ===== */
    .row .mid span.miss,.row .mid b.miss{color:#ef4444}
    #callList .row .mid span{white-space:normal;font-size:13.5px}
    .cb{flex:none;display:flex;align-items:center;justify-content:center;width:42px;height:42px;padding:0;border:none;color:#25d366}
    .row.unread time{color:#25d366}
    .mutei{margin-left:6px;font-size:13px;opacity:.7;font-weight:400}
    .row.muted .ubn{background:#8a9aa3}
    .ubn{display:block;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#25d366;color:#06140c;font-size:12px;font-weight:700;line-height:22px;text-align:center;font-style:normal}

    /* ===== Zanply additions ===== */
    :root[data-theme="light"]{--bg:#f6f7fb;--card:#ffffff;--text:#1a1d29;--muted:#6b7280;--accent:#4f46e5;--border:#e5e7eb;color-scheme:light}
    :root[data-theme="dark"]{--bg:#0f1117;--card:#181b24;--text:#f3f4f6;--muted:#9ca3af;--accent:#818cf8;--border:#2a2f3b;color-scheme:dark}
    html.hc:not(.isdark){--muted:#374151;--border:#8b93a1;--accent:#3730a3}
    html.hc:not(.isdark) .zsw{border-color:#4b5563}
    html.hc:not(.isdark) .zir .zl,html.hc:not(.isdark) .zrow2 .rt small,html.hc:not(.isdark) .sub{color:#374151}
    /* Increase contrast: bold letters everywhere + stronger colours (light and dark) */
    html.hc,html.hc body,html.hc *{font-weight:700!important;text-shadow:none!important}
    html.hc{--muted:#1f2937;--border:#6b7280}
    html.hc.isdark{--muted:#e5e7eb;--border:#9ca3af;--text:#fff}
    html.hc input::placeholder,html.hc textarea::placeholder{opacity:1;color:var(--muted)}
    /* Font size: Small / Large scale the whole app, Medium is normal */
    html.fs-s :is(#welcomeView,#countryView,#authView,#appView,#threadView,#groupView,#infoView,#ginfoView,#profileView,#createView,#aiView,#callView,.zpg,.zpop,.zgs,.zlock){zoom:.88}
    html.fs-l :is(#welcomeView,#countryView,#authView,#appView,#threadView,#groupView,#infoView,#ginfoView,#profileView,#createView,#aiView,#callView,.zpg,.zpop,.zgs,.zlock){zoom:1.18}
    /* Chat bubble colour picker */
    .zbc{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 0;padding:22px 14px;justify-items:center}
    .zbc button{width:84px;height:84px;border-radius:50%;border:0;padding:0;position:relative;cursor:pointer}
    .zbc button.on{box-shadow:0 0 0 4px var(--bg),0 0 0 6px #fff}
    .zbc button .zwk{display:none;position:absolute;inset:0;align-items:center;justify-content:center;color:#fff}
    .zbc button.on .zwk{display:flex}
    /* Premium */
    :root{--zp-bg:#f3f5fa;--zp-card:#ffffff;--zp-line:rgba(0,0,0,.1)}
    html.isdark{--zp-bg:#141a26;--zp-card:#202a3a;--zp-line:rgba(255,255,255,.12)}
    .zpg.zprem{background:var(--zp-bg);color:var(--text)}
    .zprem .zpg-h{background:transparent}
    .zpm-hero{text-align:center;padding:10px 20px 6px;position:relative}
    .zpm-hero h2{font-size:24px;margin:14px 0 8px}
    .zpm-hero p{margin:0 auto;max-width:330px;line-height:1.4;opacity:.92}
    .zpm-plans,.zpm-list{background:var(--zp-card);border-radius:18px;margin:16px 14px}
    .zpm-plan,.zpm-f{border-radius:0}
    .zpm-plan{display:flex;align-items:center;gap:14px;padding:14px 16px;width:100%;background:none;border:0;color:inherit;text-align:left;cursor:pointer}
    .zpm-plan+.zpm-plan{border-top:1px solid var(--zp-line)}
    .zpm-plan .rd{width:34px;height:34px;border-radius:50%;border:2px solid #8a93a3;color:#fff;flex:none;display:flex;align-items:center;justify-content:center}
    .zpm-plan.on .rd{background:#4d9bff;border-color:#4d9bff}
    .zpm-plan .nm{flex:1}.zpm-plan .nm s{opacity:.6}
    .zpm-plan .badge{background:#3b82f6;border-radius:8px;font-size:12px;padding:2px 6px;margin-left:6px}
    .zpm-f{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;width:100%;background:none;border:0;color:inherit;text-align:left;cursor:pointer}
    .zpm-f+.zpm-f{border-top:1px solid var(--zp-line)}
    .zpm-f .ic{width:36px;height:36px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;font-size:18px}
    .zpm-f .tx{flex:1}.zpm-f .tx small{display:block;opacity:.6;margin-top:3px;line-height:1.35;font-size:14px;font-weight:400}
    .zpm-f .ch{opacity:.55;align-self:center}
    .zpm-cta{position:sticky;bottom:14px;margin:8px 14px 14px;height:56px;border-radius:28px;border:0;color:#fff;font-size:17px;width:calc(100% - 28px);background:linear-gradient(90deg,#6c8cff,#c25cf0 60%,#ff6fb5);cursor:pointer}
    /* Stars + gift picker + affiliate */
    .zgs{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
    .zgs-d{background:var(--card,#1f2a37);color:var(--text);width:100%;max-height:82vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;max-width:720px;margin:0 auto}
    .zgs-t{padding:18px 20px;font-size:20px;font-weight:700;border-bottom:1px solid var(--border)}
    .zgs-s{padding:14px 20px;border:0;border-bottom:1px solid var(--border);background:transparent;color:var(--text);font:inherit;width:100%;box-sizing:border-box;outline:none;border-radius:0;margin:0}
    .zgs-l{overflow-y:auto;flex:1}
