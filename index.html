<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zanply</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #181b24;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #25d366;
      --border: #2a2f3b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    }
    .app {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px 14px 80px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0;
      font-size: 28px;
    }
    .menuwrap { position: relative; }
    .menu-toggle {
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 28px;
      padding: 6px 12px;
      cursor: pointer;
    }
    .menu-box {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      min-width: 200px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
      z-index: 20;
    }
    .menu-box button {
      width: 100%;
      padding: 10px 12px;
      background: transparent;
      border: none;
      color: var(--text);
      font: inherit;
      text-align: left;
      border-radius: 8px;
      cursor: pointer;
    }
    .menu-box button:hover { background: rgba(255,255,255,.04); }
    .searchbox {
      margin-bottom: 12px;
    }
    .searchbox input {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--card);
      color: var(--text);
      font: inherit;
    }
    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 14px;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .filters button {
      flex: 1;
      min-width: 90px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: 9px 12px;
      font: inherit;
      cursor: pointer;
    }
    .filters button.active {
      background: rgba(37, 211, 102, 0.12);
      border-color: rgba(37, 211, 102, 0.5);
      color: var(--accent);
    }
    .chat-list { display: flex; flex-direction: column; gap: 0; }
    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 4px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .row.unread { background: rgba(37, 211, 102, 0.04); }
    .row.muted { opacity: 0.8; }
    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #36d399, #10b981);
      color: #081c12;
      font-weight: 700;
      flex-shrink: 0;
    }
    .mid {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .name {
      font-size: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .snippet {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      flex-shrink: 0;
    }
    .time {
      color: var(--muted);
      font-size: 12px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 11px;
      background: var(--accent);
      color: #06140c;
      font-size: 12px;
      font-weight: 700;
    }
    .mute-tag {
      font-size: 12px;
      color: var(--muted);
      opacity: 0.8;
      display: none;
    }
    .row.muted .mute-tag { display: inline; }
    .fab {
      position: fixed;
      right: 18px;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      width: 62px;
      height: 62px;
      border: none;
      border-radius: 18px;
      background: var(--accent);
      color: #06140c;
      font-size: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(37,211,102,.4);
      cursor: pointer;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 110px;
      transform: translateX(-50%);
      background: rgba(20,24,30,.95);
      color: white;
      padding: 9px 14px;
      border-radius: 12px;
      font-size: 14px;
      z-index: 50;
      opacity: 0;
      transition: opacity .18s ease;
    }
    .toast.show { opacity: 1; }
    @media (max-width: 420px) {
      .app { padding-left: 12px; padding-right: 12px; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>Zanply</h1>
      <div class="menuwrap">
        <button id="menuBtn" class="menu-toggle" aria-label="Menu">☰</button>
        <div id="menuBox" class="menu-box hidden">
          <button id="menuReadAll" type="button">Read all</button>
          <button id="menuMuteAll" type="button">Mute all</button>
        </div>
      </div>
    </div>

    <div class="searchbox">
      <input id="searchBox" type="search" placeholder="Search chats" />
    </div>

    <nav class="filters" aria-label="Chat filters">
      <button class="active" type="button">All</button>
      <button type="button">Unread</button>
      <button type="button">Favourites</button>
      <button type="button">Groups</button>
    </nav>

    <div id="chatList" class="chat-list" aria-live="polite">
      <div class="row unread" data-phone="+254700000001">
        <div class="avatar">K</div>
        <div class="mid">
          <div class="name">Kogo</div>
          <div class="snippet">Can we meet later?</div>
        </div>
        <div class="meta">
          <div class="time">2m</div>
          <span class="badge">1</span>
        </div>
      </div>

      <div class="row muted" data-phone="+254700000002">
        <div class="avatar">N</div>
        <div class="mid">
          <div class="name">Njeri</div>
          <div class="snippet">Let's sync tomorrow.</div>
        </div>
        <div class="meta">
          <div class="time">1h</div>
          <span class="mute-tag">Muted</span>
        </div>
      </div>
    </div>
  </div>

  <button id="btnNew" class="fab" aria-label="New chat">＋</button>
  <div id="toast" class="toast" aria-live="polite"></div>

  <script>
    (function () {
      const chatList = document.getElementById('chatList');
      const toastEl = document.getElementById('toast');

      function parsePhone(v) {
        return String(v || '').replace(/[^+\d]/g, '').replace(/^00+/, '+');
      }

      function showToast(msg) {
        if (!msg) return;
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => toastEl.classList.remove('show'), 1800);
      }

      function setReadState(phone, isRead) {
        if (!phone) return;
        const rows = document.querySelectorAll('.row');
        rows.forEach((row) => {
          const rowPhone = parsePhone(row.dataset.phone || '');
          if (rowPhone !== phone) return;
          row.classList.toggle('unread', !isRead);
          const badge = row.querySelector('.badge');
          if (badge) {
            badge.style.display = isRead ? 'none' : 'inline-flex';
          }
        });
      }

      function setMuteState(phone, muted) {
        if (!phone) return;
        const rows = document.querySelectorAll('.row');
        rows.forEach((row) => {
          const rowPhone = parsePhone(row.dataset.phone || '');
          if (rowPhone !== phone) return;
          row.classList.toggle('muted', muted);
          const tag = row.querySelector('.mute-tag');
          if (tag) tag.style.display = muted ? 'inline' : 'none';
        });
      }

      function nativeCall(name, args) {
        try {
          const nativeApi = window.ZanplyNative;
          if (!nativeApi) return false;

          if (typeof nativeApi[name] === 'function') {
            nativeApi[name](...(Array.isArray(args) ? args : [args]));
            return true;
          }

          if (name === 'setMute' && typeof nativeApi.mutes === 'function') {
            nativeApi.mutes(args[0], args[1]);
            return true;
          }

          if (name === 'readTake' && typeof nativeApi.takeRead === 'function') {
            nativeApi.takeRead();
            return true;
          }

          if (name === 'readAdd' && typeof nativeApi.readAdd === 'function') {
            nativeApi.readAdd(args[0]);
            return true;
          }
        } catch (e) {
          console.warn('Native bridge call failed:', e);
        }
        return false;
      }

      function markChatRead(phone) {
        if (!phone) return;
        try {
          localStorage.setItem('zaply_read_' + phone, '1');
        } catch (e) {}
        setReadState(phone, true);
        nativeCall('readAdd', [phone]);
        showToast('Marked as read');
      }

      function markAllRead() {
        document.querySelectorAll('.row').forEach((row) => {
          const phone = parsePhone(row.dataset.phone || '');
          if (phone) {
            try { localStorage.setItem('zaply_read_' + phone, '1'); } catch (e) {}
            setReadState(phone, true);
          }
        });
        nativeCall('readTake', []);
        showToast('All chats marked as read');
      }

      function muteChat(phone, hours) {
        if (!phone) return;
        const until = Date.now() + Number(hours || 1) * 60 * 60 * 1000;
        try {
          const map = JSON.parse(localStorage.getItem('zaply_mutes') || '{}');
          map[phone] = until;
          localStorage.setItem('zaply_mutes', JSON.stringify(map));
        } catch (e) {}
        setMuteState(phone, true);
        nativeCall('setMute', [phone, until]);
        showToast('Chat muted');
      }

      function unmuteChat(phone) {
        if (!phone) return;
        try {
          const map = JSON.parse(localStorage.getItem('zaply_mutes') || '{}');
          delete map[phone];
          localStorage.setItem('zaply_mutes', JSON.stringify(map));
        } catch (e) {}
        setMuteState(phone, false);
        nativeCall('setMute', [phone, 0]);
        showToast('Chat unmuted');
      }

      function restoreReadAndMuteState() {
        try {
          const mutes = JSON.parse(localStorage.getItem('zaply_mutes') || '{}');
          Object.entries(mutes).forEach(([phone, until]) => {
            const ts = Number(until || 0);
            if (!phone || !ts || ts < Date.now()) {
              delete mutes[phone];
              return;
            }
            setMuteState(phone, true);
          });
          localStorage.setItem('zaply_mutes', JSON.stringify(mutes));
        } catch (e) {}

        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (!key || !key.startsWith('zaply_read_')) continue;
          const phone = key.replace(/^zaply_read_/, '');
          if (phone && localStorage.getItem(key) === '1') {
            setReadState(phone, true);
          }
        }
      }

      document.getElementById('menuBtn').addEventListener('click', () => {
        document.getElementById('menuBox').classList.toggle('hidden');
      });

      document.getElementById('menuReadAll').addEventListener('click', () => {
        markAllRead();
        document.getElementById('menuBox').classList.add('hidden');
      });

      document.getElementById('menuMuteAll').addEventListener('click', () => {
        document.querySelectorAll('.row').forEach((row) => {
          const phone = parsePhone(row.dataset.phone || '');
          if (phone) muteChat(phone, 24 * 7);
        });
        document.getElementById('menuBox').classList.add('hidden');
      });

      chatList.addEventListener('click', (event) => {
        const row = event.target.closest('.row');
        if (!row) return;
        const phone = parsePhone(row.dataset.phone || '');
        if (!phone) return;

        const badge = row.querySelector('.badge');
        if (badge && badge.style.display !== 'none') {
          markChatRead(phone);
        }
      });

      chatList.addEventListener('contextmenu', (event) => {
        const row = event.target.closest('.row');
        if (!row) return;
        event.preventDefault();
        const phone = parsePhone(row.dataset.phone || '');
        if (!phone) return;
        const muted = row.classList.contains('muted');
        if (muted) unmuteChat(phone);
        else muteChat(phone, 24);
      });

      restoreReadAndMuteState();
    })();
  </script>
</body>
</html>
